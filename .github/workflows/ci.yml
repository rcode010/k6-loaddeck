name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "2.3.0"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node --import tsx --test --test-reporter=./scripts/ci-reporter.mjs test/*.test.ts
        env:
          LOADDECK_TEST_K6: k6
          LOADDECK_TEST_SYSTEM_CA: ${{ runner.os == 'macOS' && '1' || '0' }}
      - run: npm run format:check
      - run: npm run package
